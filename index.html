<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win Airtime</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <script>

/* ===============================
   STRONG ACCESS PROTECTION
   =============================== */

const SECRET_KEY = "affiliate2026";
const AFFILIATE_LOGIN = "https://freedomnetwork.work/login.html";

const params = new URLSearchParams(window.location.search);

const accessKey = params.get("access");
const time = Number(params.get("time"));

const now = Date.now();
const maxAge = 5 * 60 * 1000; // 5 minutes

function showAccessError(message) {
    const apply = () => {
        const msg = document.getElementById('accessMessage');
        const card = document.querySelector('.game-card');
        const referral = document.querySelector('.referral-container');
        if (msg) {
            msg.innerText = message;
            msg.style.display = 'block';
        }
        if (card) {
            card.style.display = 'none';
        }
        if (referral) {
            referral.style.display = 'block'; // Ensure referral button is visible
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', apply);
    } else {
        apply();
    }
}

// Check key
if (accessKey !== SECRET_KEY) {
    showAccessError('Access denied. Please login from the Affiliate website. You will be redirected shortly.');
    setTimeout(() => window.location.href = AFFILIATE_LOGIN, 5000);
}

// Check timestamp
if (!time || (now - time) > maxAge) {
    showAccessError('Session expired. Please return to the Affiliate site. You will be redirected shortly.');
    setTimeout(() => window.location.href = AFFILIATE_LOGIN, 5000);
}

// If access is valid, show the game content
if (accessKey === SECRET_KEY && time && (now - time) <= maxAge) {
    const showGame = () => {
        const card = document.querySelector('.game-card');
        const referral = document.querySelector('.referral-container');
        if (card) card.style.display = 'block';
        if (referral) referral.style.display = 'block';
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', showGame);
    } else {
        showGame();
    }
}

/* ===============================
   CLEAN URL
   =============================== */

if (window.history.replaceState) {

const cleanURL =
window.location.protocol +
"//" +
window.location.host +
window.location.pathname;

window.history.replaceState({}, document.title, cleanURL);

} 

</script>

    <style>

        #wheelWrapper { position: relative; display: inline-block; margin: 18px 0; cursor: pointer; touch-action: manipulation; width: min(84vw, 340px); }

}

        .tiktok-embed { margin: 0 auto !important; }

        @keyframes pulse-red { 0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);} }
        .warning-pulse { animation: pulse-red 0.6s infinite; font-size: 20px; font-weight:700; }

        /* Option buttons and lists */
        .option-list { width: 100%; display:flex; flex-direction:column; gap:8px; align-items:center; }
        .option-btn { width: 100%; max-width:420px; padding:10px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer; }

        /* Responsive tweaks */

            .option-btn { min-width: 0; }
        }

<script>
/* ===============================
   FIREBASE ANONYMOUS LOGIN
   =============================== */

auth.signInAnonymously()
.then(() => {

console.log("Anonymous login successful");

})
.catch((error) => {

console.error("Anonymous login error:", error);

});

/* ===============================
   CREATE SESSION FOR PLAYER
   =============================== */

function generateSessionID(){

return "sess_" + Math.random().toString(36).substring(2,12);

}

auth.onAuthStateChanged(async (user)=>{

if(user){

const sessionID = generateSessionID();

try {

await db.collection("game_sessions").doc(sessionID).set({

uid:user.uid,

createdAt:Date.now(),

used:false

});

console.log("Game session created:",sessionID);

} catch (err) {

console.error("Error creating game session:", err);

}

}

});

</script>
